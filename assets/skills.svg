<svg width="800" height="296" viewBox="0 0 800 296" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6AD3F7"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="800" height="296" rx="12" fill="url(#bgGrad)"/>
  <rect width="800" height="296" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Animated top accent bar -->
  <rect y="0" height="3" rx="1.5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="800" dur="1.4s" fill="freeze"
      calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x" from="0" to="0" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="14"
    fill="#6AD3F7" font-weight="bold" letter-spacing="4">
    PROFICIENCY
  </text>

  <!-- ── Row helper: label x=20, bar x=185 w=565, pct x=760 ── -->
  <!-- Row spacing: first bar top = 58, each row = 40px -->

  <!-- Python 90% → 508 -->
  <text x="20" y="72" font-family="'Courier New',monospace" font-size="13" fill="#c9d1d9">Python</text>
  <rect x="185" y="60" width="565" height="14" rx="7" fill="#1c2128"/>
  <rect x="185" y="60"             height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="509" dur="1.1s" begin="0.15s" fill="freeze"
      calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="760" y="72" text-anchor="end" font-family="monospace" font-size="12" fill="#6AD3F7">90%</text>

  <!-- PyTorch 80% → 452 -->
  <text x="20" y="112" font-family="'Courier New',monospace" font-size="13" fill="#c9d1d9">PyTorch</text>
  <rect x="185" y="100" width="565" height="14" rx="7" fill="#1c2128"/>
  <rect x="185" y="100"             height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="452" dur="1.1s" begin="0.35s" fill="freeze"
      calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="760" y="112" text-anchor="end" font-family="monospace" font-size="12" fill="#6AD3F7">80%</text>

  <!-- HuggingFace 75% → 424 -->
  <text x="20" y="152" font-family="'Courier New',monospace" font-size="13" fill="#c9d1d9">HuggingFace</text>
  <rect x="185" y="140" width="565" height="14" rx="7" fill="#1c2128"/>
  <rect x="185" y="140"             height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="424" dur="1.1s" begin="0.55s" fill="freeze"
      calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="760" y="152" text-anchor="end" font-family="monospace" font-size="12" fill="#6AD3F7">75%</text>

  <!-- TensorFlow 70% → 396 -->
  <text x="20" y="192" font-family="'Courier New',monospace" font-size="13" fill="#c9d1d9">TensorFlow</text>
  <rect x="185" y="180" width="565" height="14" rx="7" fill="#1c2128"/>
  <rect x="185" y="180"             height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="396" dur="1.1s" begin="0.75s" fill="freeze"
      calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="760" y="192" text-anchor="end" font-family="monospace" font-size="12" fill="#6AD3F7">70%</text>

  <!-- Django 65% → 367 -->
  <text x="20" y="232" font-family="'Courier New',monospace" font-size="13" fill="#c9d1d9">Django</text>
  <rect x="185" y="220" width="565" height="14" rx="7" fill="#1c2128"/>
  <rect x="185" y="220"             height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="367" dur="1.1s" begin="0.95s" fill="freeze"
      calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="760" y="232" text-anchor="end" font-family="monospace" font-size="12" fill="#6AD3F7">65%</text>

  <!-- Docker 55% → 311 -->
  <text x="20" y="272" font-family="'Courier New',monospace" font-size="13" fill="#c9d1d9">Docker</text>
  <rect x="185" y="260" width="565" height="14" rx="7" fill="#1c2128"/>
  <rect x="185" y="260"             height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="311" dur="1.1s" begin="1.15s" fill="freeze"
      calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="760" y="272" text-anchor="end" font-family="monospace" font-size="12" fill="#6AD3F7">55%</text>
</svg>
